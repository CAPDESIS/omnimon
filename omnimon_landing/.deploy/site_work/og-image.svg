<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060a14"/>
      <stop offset="50%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#060a14"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="60" y1="0" x2="60" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="200" cy="250" r="200" fill="#00f0ff" opacity="0.04"/>
  <circle cx="900" cy="400" r="250" fill="#00ff88" opacity="0.03"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyan-grad)" opacity="0.6"/>

  <!-- Logo icon -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
    <circle cx="28" cy="28" r="16" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="28" y1="14" x2="28" y2="22" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="34" x2="28" y2="42" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="14" y1="28" x2="22" y2="28" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="34" y1="28" x2="42" y2="28" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="28" cy="28" r="3" fill="#00f0ff" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="180" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#e2e8f0" letter-spacing="-1">OmniMon</text>

  <!-- Version badge -->
  <rect x="540" y="198" width="80" height="32" rx="16" fill="#00f0ff" opacity="0.12" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="580" y="220" font-family="monospace" font-size="14" font-weight="700" fill="#00f0ff" text-anchor="middle">v6.0.1</text>

  <!-- Subtitle -->
  <text x="100" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">System monitoring,</text>
  <text x="100" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="url(#cyan-grad)" font-weight="600">reimagined.</text>

  <!-- Description -->
  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">Real-time process tracking, network telemetry, and security analysis</text>
  <text x="100" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">Built with Rust for maximum performance. MIT Licensed.</text>

  <!-- Tech stack pills -->
  <g transform="translate(100, 460)">
    <rect x="0" y="0" width="80" height="32" rx="8" fill="#ffb800" opacity="0.1" stroke="#ffb800" stroke-width="1" stroke-opacity="0.3"/>
    <text x="40" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#ffb800" text-anchor="middle">Rust</text>

    <rect x="96" y="0" width="90" height="32" rx="8" fill="#00f0ff" opacity="0.1" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>
    <text x="141" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#00f0ff" text-anchor="middle">Tauri 2</text>

    <rect x="202" y="0" width="94" height="32" rx="8" fill="#ff3366" opacity="0.1" stroke="#ff3366" stroke-width="1" stroke-opacity="0.3"/>
    <text x="249" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#ff3366" text-anchor="middle">Svelte 5</text>
  </g>

  <!-- Stats -->
  <g transform="translate(100, 530)">
    <text x="0" y="0" font-family="monospace" font-size="28" font-weight="800" fill="#00f0ff">60fps</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">UI Refresh</text>

    <text x="160" y="0" font-family="monospace" font-size="28" font-weight="800" fill="#00ff88">~10MB</text>
    <text x="160" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">App Size</text>

    <text x="340" y="0" font-family="monospace" font-size="28" font-weight="800" fill="#ffb800">~30MB</text>
    <text x="340" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">RAM Usage</text>
  </g>

  <!-- Terminal mockup on the right side -->
  <g transform="translate(680, 130)">
    <rect x="0" y="0" width="440" height="370" rx="10" fill="#0a0e1a" stroke="#1e293b" stroke-width="1"/>
    <!-- Terminal header -->
    <rect x="0" y="0" width="440" height="36" rx="10" fill="#111827"/>
    <rect x="0" y="26" width="440" height="10" fill="#111827"/>
    <circle cx="20" cy="18" r="5" fill="#ff3366" opacity="0.8"/>
    <circle cx="38" cy="18" r="5" fill="#ffb800" opacity="0.8"/>
    <circle cx="56" cy="18" r="5" fill="#00ff88" opacity="0.8"/>
    <text x="220" y="22" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">omnimon --overview</text>

    <!-- Terminal content -->
    <text x="20" y="62" font-family="monospace" font-size="12" fill="#94a3b8">$ omnimon --overview</text>
    <text x="20" y="90" font-family="monospace" font-size="11" fill="#00f0ff">  SYSTEM OVERVIEW      v6.0.1</text>
    <text x="20" y="112" font-family="monospace" font-size="11" fill="#1e293b">  ─────────────────────────────</text>

    <text x="20" y="140" font-family="monospace" font-size="12" fill="#00ff88">  CPU</text>
    <text x="80" y="140" font-family="monospace" font-size="12" fill="#94a3b8">████████████░░░░░░  58.3%</text>

    <text x="20" y="166" font-family="monospace" font-size="12" fill="#ffb800">  MEM</text>
    <text x="80" y="166" font-family="monospace" font-size="12" fill="#94a3b8">██████████████░░░░  71.2%</text>

    <text x="20" y="192" font-family="monospace" font-size="12" fill="#00ff88">  SWP</text>
    <text x="80" y="192" font-family="monospace" font-size="12" fill="#94a3b8">██░░░░░░░░░░░░░░░░   8.1%</text>

    <text x="20" y="224" font-family="monospace" font-size="11" fill="#00f0ff">  TOP PROCESSES          CPU   MEM</text>
    <text x="20" y="246" font-family="monospace" font-size="11" fill="#1e293b">  ─────────────────────────────</text>

    <text x="20" y="268" font-family="monospace" font-size="11" fill="#e2e8f0">  firefox      pid 2841  12.4%  3.2G</text>
    <text x="20" y="290" font-family="monospace" font-size="11" fill="#e2e8f0">  node         pid 3102   8.7%  1.1G</text>
    <text x="20" y="312" font-family="monospace" font-size="11" fill="#e2e8f0">  rust-analyzer pid 4210  6.2%  890M</text>

    <text x="20" y="346" font-family="monospace" font-size="11" fill="#00ff88">  ✓ 0 threats detected · shield active</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#cyan-grad)" opacity="0.4"/>
</svg>
