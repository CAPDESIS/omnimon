thresholds:
  ram_free_percent: 22
  swap_used_mb: 3072
  process_ram_min_kb: 153600
  idle_cpu_percent: 1.0
  idle_ram_trigger_percent: 35

custom_processes:
  - name: "Google Chrome Updater"
    max_instances: 1
  - name: "Creative Cloud"
    max_cpu_percent: 35
  - name: "Adobe Desktop Service"
    max_cpu_percent: 35

intervals:
  check: 45
  idle_check: 480
  cooldown: 240
  kill_grace: 3
