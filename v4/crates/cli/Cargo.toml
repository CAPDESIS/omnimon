[package]
name = "cli"
version = "5.3.0"
edition = "2021"
description = "OmniMon CLI application"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
core = { path = "../core", features = ["network-capture"] }
omnimon-tui = { path = "../tui" }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
keyring = { version = "3", default-features = false }
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
