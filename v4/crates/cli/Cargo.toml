[package]
name = "cli"
version = "4.3.0"
edition = "2021"
description = "OmniMon CLI application"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
core = { path = "../core" }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
