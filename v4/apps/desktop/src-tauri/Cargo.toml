[package]
name = "macmon-desktop"
version = "4.0.0"
edition = "2021"

[lib]
name = "macmon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macmon_core = { package = "core", path = "../../../crates/core" }
sysinfo = "0.30"
