name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install jq 2>/dev/null || true
          brew install bats-core 2>/dev/null || true

      - name: Verify tag matches source version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRC_VERSION=$(grep -o 'MACMON_VERSION="[^"]*"' lib/macmon-core.sh | cut -d'"' -f2)
          echo "Tag version: $TAG_VERSION"
          echo "Source version: $SRC_VERSION"
          if [[ "$TAG_VERSION" != "$SRC_VERSION" ]]; then
            echo "ERROR: Tag $GITHUB_REF_NAME does not match MACMON_VERSION=$SRC_VERSION"
            exit 1
          fi

      - name: Run BATS tests
        run: make test

      - name: Run XCTests
        run: make swift-test

      - name: Check shell syntax
        run: make check

      - name: Build universal binaries
        run: make clean && make build

      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar czf "dist/macmon-${VERSION}-macos-universal.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.dSYM' \
            -s '/^\./macmon/' \
            .

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
