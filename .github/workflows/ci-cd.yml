name: OmniMon v4 CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-coverage:
    name: Test and Coverage (Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Tests and Generate Coverage (Gate)
        working-directory: ./v4
        run: |
          cargo llvm-cov --all-features --workspace --fail-under-lines 85 --lcov --output-path lcov.info
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./v4/lcov.info
          fail_ci_if_error: true

  vulnerability-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Grype
        uses: anchore/sbom-action/download-syft@v0
      
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan dependencies with Grype
        run: |
          grype dir:. -o json > grype-report.json

      - name: Generate NIST Compliance Report (HTML)
        run: |
          chmod +x .github/scripts/generate_nist_report.sh
          ./.github/scripts/generate_nist_report.sh grype-report.json nist-compliance-report.html

      - name: Upload NIST Report
        uses: actions/upload-artifact@v4
        with:
          name: nist-compliance-report
          path: nist-compliance-report.html

  build-and-sign:
    name: Build & Package (${{ matrix.os }})
    needs: [test-and-coverage, vulnerability-scan]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: omnimon-macos
            ext: dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: omnimon-linux
            ext: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: omnimon-windows
            ext: exe
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Build CLI Release
        working-directory: ./v4/crates/cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke Test (omnimon doctor)
        working-directory: ./v4/crates/cli
        run: |
          echo "Running Smoke Test to ensure binary links correctly to native libs..."
          ../../target/${{ matrix.target }}/release/cli doctor

