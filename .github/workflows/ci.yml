name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install jq 2>/dev/null || true
          brew install bats-core 2>/dev/null || true

      - name: Syntax check all shell scripts
        run: |
          bash -n lib/macmon-core.sh
          bash -n lib/macmon-config.sh
          bash -n lib/macmon-security.sh
          bash -n src/daemon/macmond.sh
          bash -n src/cli/macmon.sh
          bash -n scripts/chrome-tabs.sh
          bash -n scripts/graceful-quit.sh

      - name: Compile Swift binaries
        run: make build

      - name: Run BATS tests
        run: make test

      - name: Run XCTests
        run: make swift-test

      - name: Verify version consistency
        run: |
          VERSION=$(grep -o 'MACMON_VERSION="[^"]*"' lib/macmon-core.sh | cut -d'"' -f2)
          echo "Version in macmon-core.sh: $VERSION"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Could not extract MACMON_VERSION"
            exit 1
          fi

      - name: Cleanup
        run: make clean
