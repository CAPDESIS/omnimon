# Runner policy (CAPDESIS fleet): this repository is PUBLIC, so every job runs
# on GitHub-hosted runners (ubuntu-latest / macos-latest / windows-latest).
# No job uses the shared CAPDESIS fleet runners. A public repository's workflow
# can reach any runner group it is granted, and those hosts carry production
# SSH and Docker access, so a public repo must never schedule work on them.
# The release lane builds Linux, macOS and Windows artifacts, and the signing
# and asset-rename jobs run on ubuntu-latest too. The Ed25519 signing secret is
# only ever read by jobs triggered by tags or workflow_dispatch, never by forks.
name: OmniMon CI/CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (leave blank for validation only)"
        required: false
        type: string

  pull_request:
    branches: [main]

  # Validation on the exact SHA that lands on main. Release and signing jobs
  # never run from a branch push: they need a tag or workflow_dispatch input.
  push:
    branches: [main]

  # Base-controlled policy signal only. This event never checks out or runs
  # pull-request code; it makes unsupported fork PRs explicitly red instead
  # of all-skipped green (fail-closed, mirrored from CapGym ci.yml).
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily to avoid runner bottlenecks.
    # Release/sign jobs stay gated to tags and workflow_dispatch (no daily deploys).
    - cron: '0 12 * * *'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fork-policy:
    name: Fork policy (no untrusted code)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Deliberately no checkout and no repository script invocation here.
      - name: Reject fork PRs without executing their code
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PR code is not executed by this workflow. A maintainer must review and bring the commits onto a trusted repository branch."
            exit 1
          fi
          echo "Same-repository PR; pull_request jobs provide the executable validation."

  lint:
    name: Lint (fmt + clippy)
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "v4"

      - name: Install Linux Dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libssl-dev
          # libappindicator3-dev was dropped in Ubuntu 24.04; ayatana is the
          # replacement that tray-icon/libappindicator-sys links against.
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Check Formatting
        run: cargo fmt --check
        working-directory: ./v4

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: ./v4

  memory-guard:
    name: Memory Guard prove
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classifier contract
        run: bash tools/macos-memory-guard/memory-guard.sh selftest

  openrouter-only:
    name: OpenRouter-only guard (no direct OpenAI)
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject direct-OpenAI usage
        run: python3 scripts/openrouter-only-validate.py --root . --app omnimon

  release-pipeline-contract:
    name: Release pipeline contract (signing, checksums, publish gates)
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure PyYAML for the workflow graph checks
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Run release pipeline regression tests
        run: python3 scripts/test_release_pipeline.py -v

      - name: Lint release scripts
        run: shellcheck scripts/sign-release.sh scripts/release-checksums.sh scripts/release-assets.sh

  select-test-matrix:
    name: Select validation platforms
    needs: [lint]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          # Public repository: GitHub-hosted runners are free, so the daily
          # schedule validates Linux on ubuntu-latest. macOS/Windows stay
          # opt-in via workflow_dispatch only to keep the daily run short;
          # they are GitHub-hosted too and cost nothing here.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix='{"include":[{"platform":"linux","os":"ubuntu-latest","experimental":false},{"platform":"macos","os":"macos-latest","experimental":true},{"platform":"windows","os":"windows-latest","experimental":true}]}'
          else
            matrix='{"include":[{"platform":"linux","os":"ubuntu-latest","experimental":false}]}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.platform }})
    needs: [lint, select-test-matrix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-test-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.97.1"

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "v4"

      - name: Install Linux Dependencies (Ubuntu Tauri packages only)
        if: matrix.platform == 'linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libssl-dev
          # libappindicator3-dev was dropped in Ubuntu 24.04; ayatana is the
          # replacement that tray-icon/libappindicator-sys links against.
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Run Cargo Check
        run: cargo check --workspace
        working-directory: ./v4

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: ./v4

      - name: Run Backend Tests
        run: cargo test --workspace -- --test-threads=1
        working-directory: ./v4

      - name: Run Frontend Tests
        run: bun run test
        working-directory: ./v4/apps/desktop

      - name: Build Frontend
        run: bun run build
        working-directory: ./v4/apps/desktop

      - name: Verify CLI Help Command
        run: cargo run -p cli -- --help
        working-directory: ./v4

  coverage:
    name: Coverage Gates
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.97.1"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@03e268b84870ac3cfa58a44d9b504511b732a857 # cargo-llvm-cov

      - name: Install Linux Dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libssl-dev
          # libappindicator3-dev was dropped in Ubuntu 24.04; ayatana is the
          # replacement that tray-icon/libappindicator-sys links against.
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Frontend coverage check
        working-directory: ./v4/apps/desktop
        run: |
          # Vitest enforces thresholds (lines/functions/statements 85%, branches 70%).
          # FILT excludes App.svelte, main.ts, vite-env.d.ts, lib/types.ts (see vitest.config.ts).
          bun run test:coverage -- --coverage.reporter=text-summary --coverage.reporter=json-summary
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("coverage/coverage-summary.json").read_text())
          lines = float(summary["total"]["lines"]["pct"])
          print(f"Frontend FILT line coverage (vitest include/exclude): {lines:.2f}%")
          print("Excluded from vitest denominator: App.svelte, main.ts, vite-env.d.ts, lib/types.ts")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## Frontend coverage denominators\n\n")
                  fh.write(f"- **FILT (vitest gate):** {lines:.2f}%\\n")
                  fh.write("- **Outside gate:** App.svelte, main.ts, types (see vitest.config.ts exclude)\\n")
          PY

      - name: Rust coverage check (RAW honest gate)
        working-directory: ./v4
        run: |
          set -euo pipefail
          # Fase 3 k27: gate uses RAW workspace llvm-cov total. The old regex filter
          # (--ignore-filename-regex ai.rs|src-tauri|...) hid 42.1% of Rust and
          # reported ~91.75% while honest RAW was ~82.84% on ci-runner-node (2026-07-31).
          # Ratcheted to 85 after T16 tests lifted honest workspace total to ~86.4% (2026-07-31).
          MIN_RAW=85
          cargo llvm-cov --workspace --fail-under-lines "${MIN_RAW}" -- --test-threads=1
          echo "Rust gate: RAW workspace lines >= ${MIN_RAW}%"
          echo "--- Legacy regex-filtered view (informational only, NOT the gate) ---"
          cargo llvm-cov --workspace --summary-only \
            --ignore-filename-regex "(ai\.rs|src-tauri|cli/src/main\.rs|os_native\.rs|network\.rs|tui/src/)" \
            -- --test-threads=1 | grep -E '^TOTAL' || true

  security:
    name: Security Audit
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-audit shells out to `cargo`, so the job sets up the pinned Rust
      # toolchain explicitly instead of relying on a preinstalled one. Without
      # this step `cargo audit` exits 127 (command not found).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.97.1"

      - name: Install cargo-audit
        uses: taiki-e/install-action@1929cdef3ca26202efbfbb4719c58ecf43e84097 # cargo-audit

      - name: Generate Rust audit report
        if: always()
        run: |
          mkdir -p ../reports
          # cargo audit --json exits non-zero when it FINDS vulnerabilities, so a
          # non-zero exit does not by itself mean the JSON is bad. Capture to a
          # temp file and only promote it to the artifact if it actually parses as
          # JSON. A bare `> file || true` would truncate the artifact to an empty,
          # invalid-JSON file when cargo-audit is missing (install failure) or the
          # advisory DB fetch fails: that empty file then gets embedded under a
          # ```json fence in the CVE report. Fall back to a minimal valid JSON
          # placeholder so the artifact stays machine-readable.
          tmp="$(mktemp)"
          cargo audit --json >"$tmp" 2>/dev/null || true
          if [ -s "$tmp" ] && python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$tmp" 2>/dev/null; then
            mv "$tmp" ../reports/rust-audit.json
          else
            printf '{"error":"cargo audit did not produce valid JSON (audit failed to run; see Cargo Audit (CVE Scan) step logs)"}\n' \
              > ../reports/rust-audit.json
            rm -f "$tmp"
          fi
        working-directory: ./v4

      - name: Cargo Audit (CVE Scan)
        run: |
          echo "## Cargo Audit Results"
          # Fail the build on actual vulnerabilities (RUSTSEC advisories with a
          # security impact). Plain `cargo audit` exits non-zero only on
          # vulnerabilities, not on `unmaintained`/`unsound`/`yanked` warnings:
          # the latter are dominated by upstream GTK3 bindings that tauri/wry
          # require on Linux and cannot be fixed from this repository. The CVE
          # report artifact (generated above and uploaded below) captures those
          # warnings for tracking.
          cargo audit
        working-directory: ./v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Frontend Audit
        run: |
          mkdir -p ../../reports
          if ! bun audit --help >/dev/null 2>&1; then
            bunx audit-ci@^7 --moderate 2>&1 | tee ../../reports/frontend-audit.txt
            exit $?
          fi
          # Informe completo como artefacto, dependencias de desarrollo
          # incluidas: son la mayoria y no llegan al binario.
          bun audit 2>&1 | tee ../../reports/frontend-audit.txt || true

          # Lo que bloquea: high o critical en una dependencia de PRODUCCION.
          # Antes el paso entero llevaba `continue-on-error: true`, de modo que
          # `bun audit` salia 1 y el build seguia verde: era el unico chequeo
          # de seguridad de la flota incapaz de poner nada en rojo.
          # Estado medido 2026-09-20 tras subir dompurify a 3.4.15: produccion
          # tiene 1 moderate (devalue, arrastrado por svelte) y cero high, asi
          # que este umbral no bloquea hoy y si bloqueara una regresion grave.
          echo "--- dependencias de produccion ---"
          bun audit --prod 2>&1 | tee -a ../../reports/frontend-audit.txt || true
          bun audit --prod --audit-level=high >/dev/null 2>&1 || {
            echo "::error::Vulnerabilidad high o critical en una dependencia de produccion; el informe completo esta en reports/frontend-audit.txt"
            exit 1
          }
        working-directory: ./v4/apps/desktop

      - name: Generate CVE Report
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# OmniMon CVE Report - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Rust Dependencies"
            if [ -f reports/rust-audit.json ]; then
              echo '```json'
              cat reports/rust-audit.json
              echo '```'
            else
              echo "No Rust audit data available."
            fi
            echo ""
            echo "## Frontend Dependencies"
            if [ -f reports/frontend-audit.txt ]; then
              echo '```text'
              cat reports/frontend-audit.txt
              echo '```'
            else
              echo "No frontend audit data available."
            fi
          } > reports/cve-summary.md

      - name: Publish CVE report in job summary
        if: always()
        run: cat reports/cve-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Secret Scanning (TruffleHog)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@ef63d66d58bb7317d9b220b02af5beae569835ee # main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  e2e:
    name: E2E (Playwright, desktop)
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: ./v4/apps/desktop

      - name: Run Playwright E2E
        run: bun run test:e2e
        working-directory: ./v4/apps/desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            v4/apps/desktop/playwright-report
            v4/apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Fails the release before any asset exists when the signing secret is
  # missing or does not match the public key pinned in the build. Without
  # this gate a release could go public unsigned.
  signing-key-preflight:
    name: Signing key matches pinned release key
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check ED25519_SIGNING_KEY against the pinned public key
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
        run: bash scripts/sign-release.sh --check-key

  release:
    name: Release Builder (${{ matrix.platform }})
    needs: [lint, signing-key-preflight]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ${{ matrix.os }}
    # No continue-on-error: a failed platform must fail the release. The
    # release is created as a draft and only published by publish-release,
    # after every platform has built and every asset is signed.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            args: ""
          - platform: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.97.1"

      - name: Add Intel target for universal macOS binary
        if: matrix.platform == 'macos-universal'
        run: rustup target add x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "v4"

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libssl-dev
          # libappindicator3-dev was dropped in Ubuntu 24.04; ayatana is the
          # replacement that tray-icon/libappindicator-sys links against.
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./v4/apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "OmniMon ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Automated multiplatform release for OmniMon ${{ inputs.tag || github.ref_name }}

            **macOS note:** If macOS shows "app is damaged", run:
            ```
            xattr -cr /Applications/OmniMon.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Renaming happens first, so every checksum and signature covers the final
  # published names.
  rename-assets:
    name: Rename Release Assets
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove duplicate assets from previous builds
        run: |
          set -euo pipefail
          sleep 30
          # Collect all assets grouped by extension/type. Keep only the newest per type.
          ASSETS="$(bash scripts/release-assets.sh list "$TAG")"
          declare -A SEEN
          while IFS='|' read -r ID NAME; do
            [ -z "$NAME" ] && continue
            # Normalize to canonical type key
            KEY=""
            case "$NAME" in
              *.dmg) KEY="dmg" ;;
              *.AppImage) KEY="appimage" ;;
              *.deb) KEY="deb" ;;
              *.rpm) KEY="rpm" ;;
              *.msi) KEY="msi" ;;
              *.nsis.zip) KEY="nsis" ;;
              SHA256SUMS*|*.sig.json|releases.json) continue ;;
              *) continue ;;
            esac
            if [ -n "${SEEN[$KEY]+x}" ]; then
              echo "Deleting duplicate: $NAME (ID: $ID)"
              gh api "repos/$REPO/releases/assets/$ID" -X DELETE --silent
            else
              SEEN[$KEY]=1
            fi
          done <<< "$ASSETS"

      - name: Rename assets to user-friendly names
        run: |
          set -euo pipefail
          ASSETS="$(bash scripts/release-assets.sh list "$TAG")"
          echo "Found assets:"
          echo "$ASSETS"
          while IFS='|' read -r ID NAME; do
            NEW_NAME=""
            LABEL=""
            case "$NAME" in
              *universal*.dmg)
                NEW_NAME="OmniMon-${TAG#v}-macOS-Universal.dmg"
                LABEL="macOS (Apple Silicon + Intel)"
                ;;
              *aarch64*.dmg)
                NEW_NAME="OmniMon-${TAG#v}-macOS-Apple-Silicon.dmg"
                LABEL="macOS (Apple Silicon)"
                ;;
              *.AppImage)
                NEW_NAME="OmniMon-${TAG#v}-Linux.AppImage"
                LABEL="Linux (AppImage - portable)"
                ;;
              *.deb)
                NEW_NAME="OmniMon-${TAG#v}-Linux.deb"
                LABEL="Linux (Debian/Ubuntu)"
                ;;
              *.rpm)
                NEW_NAME="OmniMon-${TAG#v}-Linux.rpm"
                LABEL="Linux (Fedora/RHEL/openSUSE)"
                ;;
              *.msi)
                NEW_NAME="OmniMon-${TAG#v}-Windows.msi"
                LABEL="Windows (64-bit installer)"
                ;;
              *.nsis.zip)
                NEW_NAME="OmniMon-${TAG#v}-Windows-Setup.exe.zip"
                LABEL="Windows (NSIS installer)"
                ;;
              *)
                echo "Skipping: $NAME"
                continue
                ;;
            esac
            if [ "$NAME" = "$NEW_NAME" ]; then
              echo "Already named: $NAME"
              continue
            fi
            echo "Renaming: $NAME -> $NEW_NAME ($LABEL)"
            gh api "repos/$REPO/releases/assets/$ID" -X PATCH -f name="$NEW_NAME" -f label="$LABEL" --silent
          done <<< "$ASSETS"
          echo "All assets renamed successfully."

  sign-release:
    name: Sign Release Artifacts (SHA-256 + Ed25519)
    needs: [signing-key-preflight, rename-assets]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ (inputs.tag || github.ref_name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the renamed release assets
        run: bash scripts/release-assets.sh download "$TAG" "$RUNNER_TEMP/release"

      - name: Generate SHA-256 checksums from the final asset names
        run: bash scripts/release-checksums.sh "$RUNNER_TEMP/release"

      - name: Sign every artifact (fails on any error, no skipped signatures)
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          VERSION_NUMBER="${VERSION#v}"
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              SHA256SUMS*|*.sig.json|releases.json) continue ;;
            esac
            echo "Signing: $f"
            bash "$GITHUB_WORKSPACE/scripts/sign-release.sh" "$f" "$VERSION_NUMBER"
          done

      - name: Generate and sign the releases.json manifest
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          export VERSION="${VERSION#v}"
          export DATE
          DATE="$(date -u +%Y-%m-%d)"
          python3 - <<'PY'
          import json, glob, os

          version = os.environ["VERSION"]
          date = os.environ["DATE"]
          artifacts = []

          for sig_file in sorted(glob.glob("*.sig.json")):
              with open(sig_file) as f:
                  sig = json.load(f)
              artifact_name = sig.get("artifact", sig_file.replace(".sig.json", ""))
              size = os.path.getsize(artifact_name)
              lower = artifact_name.lower()

              platform = "unknown"
              if "linux" in lower or ".appimage" in lower or ".deb" in lower or ".rpm" in lower:
                  platform = "linux"
              elif "macos" in lower or "darwin" in lower or ".dmg" in lower:
                  platform = "macos"
              elif "windows" in lower or ".msi" in lower or ".exe" in lower:
                  platform = "windows"

              arch = "unknown"
              if "universal" in lower:
                  arch = "universal"
              elif "aarch64" in lower or "arm64" in lower:
                  arch = "aarch64"
              elif "x86_64" in lower or "amd64" in lower:
                  arch = "x86_64"

              artifacts.append({
                  "filename": artifact_name,
                  "platform": platform,
                  "arch": arch,
                  "sha256": sig["sha256"],
                  "signature_b64": sig["signature_b64"],
                  "size_bytes": size,
              })

          if not artifacts:
              raise SystemExit("no signed artifacts to manifest")
          manifest = {
              "version": version,
              "date": date,
              "artifacts": artifacts,
              "manifest_signature": "",
          }
          with open("releases.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Generated releases.json with {len(artifacts)} artifacts")
          PY
          bash "$GITHUB_WORKSPACE/scripts/sign-release.sh" --manifest releases.json

      - name: Upload checksums, signatures and manifest to the draft release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          bash "$GITHUB_WORKSPACE/scripts/release-assets.sh" upload "$TAG" SHA256SUMS.txt
          for f in *.sig.json releases.json; do
            [ -f "$f" ] || continue
            bash "$GITHUB_WORKSPACE/scripts/release-assets.sh" upload "$TAG" "$f"
          done

  # The only step that makes the release public. It refuses unless the draft
  # has every platform binary, its .sig.json, SHA256SUMS.txt and releases.json.
  publish-release:
    name: Publish verified release
    needs: [release, rename-assets, sign-release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the draft if it is complete and signed
        run: bash scripts/release-assets.sh publish "$TAG"

