name: OmniMon CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for (e.g. v4.6.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'v4/apps/desktop/package-lock.json'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "v4"

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Install Linux Dependencies (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Check Formatting
      run: cargo fmt --check
      working-directory: ./v4

    - name: Run Clippy
      run: cargo clippy --workspace -- -D warnings
      working-directory: ./v4

    - name: Run Backend Tests with Coverage (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: cargo llvm-cov --all-features --workspace --fail-under-lines 85 --ignore-filename-regex "(ai\.rs|src-tauri|cli.src.main\.rs|os_native\.rs|network\.rs)" -- --test-threads=1
      working-directory: ./v4

    - name: Install cargo-llvm-cov (macOS)
      if: matrix.os == 'macos-latest'
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run Backend Tests with Coverage (macOS)
      if: matrix.os == 'macos-latest'
      run: cargo llvm-cov --all-features --workspace --fail-under-lines 85 --ignore-filename-regex "(ai\.rs|src-tauri|cli.src.main\.rs|os_native\.rs|network\.rs)" -- --test-threads=1
      working-directory: ./v4

    - name: Run Backend Tests (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo test -p core --lib -- --test-threads=1
      working-directory: ./v4

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: ./v4/apps/desktop

    - name: Run Frontend Tests with Coverage
      run: npx vitest run --coverage
      working-directory: ./v4/apps/desktop

    - name: Build Frontend
      run: npx vite build
      working-directory: ./v4/apps/desktop

    - name: Verify CLI Help Command
      if: matrix.os != 'windows-latest'
      run: cargo run -p cli -- --help
      working-directory: ./v4

  security:
    name: Security Audit
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "v4"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'v4/apps/desktop/package-lock.json'

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Cargo Audit (CVE Scan)
      run: |
        cargo install cargo-audit
        cargo audit --json > ../reports/rust-audit.json 2>/dev/null || true
        cargo audit
      working-directory: ./v4

    - name: npm Audit (CVE Scan)
      run: |
        npm ci
        mkdir -p ../../reports
        npm audit --json > ../../reports/npm-audit.json 2>/dev/null || true
        npm audit --audit-level=high
      working-directory: ./v4/apps/desktop

    - name: Generate CVE Report
      if: always()
      run: |
        mkdir -p reports
        echo "# OmniMon CVE Report - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > reports/cve-summary.md
        echo "" >> reports/cve-summary.md
        echo "## Rust Dependencies" >> reports/cve-summary.md
        if [ -f reports/rust-audit.json ]; then
          echo '```json' >> reports/cve-summary.md
          cat reports/rust-audit.json >> reports/cve-summary.md
          echo '```' >> reports/cve-summary.md
        else
          echo "No Rust audit data available." >> reports/cve-summary.md
        fi
        echo "" >> reports/cve-summary.md
        echo "## Node.js Dependencies" >> reports/cve-summary.md
        if [ -f reports/npm-audit.json ]; then
          echo '```json' >> reports/cve-summary.md
          cat reports/npm-audit.json >> reports/cve-summary.md
          echo '```' >> reports/cve-summary.md
        else
          echo "No npm audit data available." >> reports/cve-summary.md
        fi

    - name: Upload CVE Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cve-report
        path: reports/
        retention-days: 90

    - name: Escaneo de Secretos (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --only-verified

  release:
    name: Release Builder (${{ matrix.platform }})
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            args: ''
          - platform: macos-universal
            os: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows
            os: windows-latest
            args: ''

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'v4/apps/desktop/package-lock.json'

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: ./v4/apps/desktop

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Add Intel target for universal macOS binary
      if: matrix.platform == 'macos-universal'
      run: rustup target add x86_64-apple-darwin

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "v4"

    - name: Install Linux Dependencies (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Build and Release with Tauri Action
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        projectPath: ./v4/apps/desktop
        tagName: ${{ inputs.tag || github.ref_name }}
        releaseName: "OmniMon ${{ inputs.tag || github.ref_name }}"
        releaseBody: |
          Automated multiplatform release for OmniMon ${{ inputs.tag || github.ref_name }}

          **macOS note:** If macOS shows "app is damaged", run:
          ```
          xattr -cr /Applications/OmniMon.app
          ```
        releaseDraft: false
        prerelease: false
        args: ${{ matrix.args }}

  sign-release:
    name: Sign Release Artifacts
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Generate SHA-256 checksums and Ed25519 signatures
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        REPO="${{ github.repository }}"
        # Wait for release assets
        sleep 15
        TMPDIR=$(mktemp -d)
        # Download all release assets
        gh release download "$TAG" --repo "$REPO" --dir "$TMPDIR" || true
        # Generate SHA-256 checksums
        CHECKSUM_FILE="$TMPDIR/SHA256SUMS.txt"
        cd "$TMPDIR"
        for f in *; do
          [ -f "$f" ] || continue
          sha256sum "$f" >> SHA256SUMS.txt
        done
        echo "Generated checksums:"
        cat SHA256SUMS.txt
        # Upload checksum file to release
        gh release upload "$TAG" "$CHECKSUM_FILE" --repo "$REPO" --clobber
        echo "SHA-256 checksums uploaded to release $TAG"

  rename-assets:
    name: Rename Release Assets
    needs: [release, sign-release]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Rename assets to user-friendly names
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        REPO="${{ github.repository }}"
        # Wait for all assets to finish uploading
        sleep 30
        # Fetch asset list
        ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "\(.id)|\(.name)"')
        echo "Found assets:"
        echo "$ASSETS"
        # Rename each asset based on extension/pattern
        while IFS='|' read -r ID NAME; do
          NEW_NAME=""
          LABEL=""
          case "$NAME" in
            *universal*.dmg)
              NEW_NAME="OmniMon-${TAG#v}-macOS-Universal.dmg"
              LABEL="macOS (Apple Silicon + Intel)"
              ;;
            *aarch64*.dmg)
              NEW_NAME="OmniMon-${TAG#v}-macOS-Apple-Silicon.dmg"
              LABEL="macOS (Apple Silicon)"
              ;;
            *.AppImage)
              NEW_NAME="OmniMon-${TAG#v}-Linux.AppImage"
              LABEL="Linux (AppImage - portable)"
              ;;
            *.deb)
              NEW_NAME="OmniMon-${TAG#v}-Linux.deb"
              LABEL="Linux (Debian/Ubuntu)"
              ;;
            *.rpm)
              NEW_NAME="OmniMon-${TAG#v}-Linux.rpm"
              LABEL="Linux (Fedora/RHEL/openSUSE)"
              ;;
            *.msi)
              NEW_NAME="OmniMon-${TAG#v}-Windows.msi"
              LABEL="Windows (64-bit installer)"
              ;;
            *.nsis.zip)
              NEW_NAME="OmniMon-${TAG#v}-Windows-Setup.exe.zip"
              LABEL="Windows (NSIS installer)"
              ;;
            *)
              echo "Skipping unknown asset: $NAME"
              continue
              ;;
          esac
          echo "Renaming: $NAME -> $NEW_NAME ($LABEL)"
          gh api "repos/$REPO/releases/assets/$ID" -X PATCH -f name="$NEW_NAME" -f label="$LABEL" --silent
        done <<< "$ASSETS"
        echo "All assets renamed successfully."
