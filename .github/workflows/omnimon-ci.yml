name: OmniMon CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'v4/apps/desktop/package-lock.json'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "v4"

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Install Linux Dependencies (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Check Formatting
      run: cargo fmt --check
      working-directory: ./v4

    - name: Run Clippy
      run: cargo clippy --workspace -- -D warnings
      working-directory: ./v4

    - name: Run Backend Tests with Coverage
      run: cargo llvm-cov --all-features --workspace --fail-under-lines 80 --ignore-filename-regex "(ai\.rs|src-tauri|cli.src.main\.rs|os_native\.rs)"
      working-directory: ./v4

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: ./v4/apps/desktop

    - name: Run Frontend Tests with Coverage
      run: npx vitest run --coverage
      working-directory: ./v4/apps/desktop

    - name: Build Frontend
      run: npx vite build
      working-directory: ./v4/apps/desktop

    - name: Verify CLI Help Command
      run: cargo run -p cli -- --help
      working-directory: ./v4

  release:
    name: Release Builder (${{ matrix.os }})
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'v4/apps/desktop/package-lock.json'

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: ./v4/apps/desktop

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "v4"

    - name: Install Linux Dependencies (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Build and Release with Tauri Action
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        projectPath: ./v4/apps/desktop
        tagName: ${{ github.ref_name }}
        releaseName: "OmniMon ${{ github.ref_name }}"
        releaseBody: "Automated multiplatform release for OmniMon ${{ github.ref_name }}"
        releaseDraft: true
        prerelease: false
