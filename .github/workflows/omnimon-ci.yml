name: OmniMon CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "v4/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "v4/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build release for (e.g. v5.0.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "v4"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Formatting
        run: cargo fmt --check
        working-directory: ./v4

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: ./v4

  test:
    name: Test (${{ matrix.platform }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "v4"

      - name: Install Linux Dependencies (Ubuntu Tauri packages only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Run Cargo Check
        run: cargo check --workspace
        working-directory: ./v4

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: ./v4

      - name: Run Backend Tests
        run: cargo test --workspace -- --test-threads=1
        working-directory: ./v4

      - name: Run Frontend Tests
        run: bun run test
        working-directory: ./v4/apps/desktop

      - name: Build Frontend
        run: bun run build
        working-directory: ./v4/apps/desktop

      - name: Verify CLI Help Command
        run: cargo run -p cli -- --help
        working-directory: ./v4

  coverage:
    name: Coverage Gates
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@03e268b84870ac3cfa58a44d9b504511b732a857 # cargo-llvm-cov

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Frontend coverage check
        working-directory: ./v4/apps/desktop
        run: |
          bun run test:coverage -- --coverage.reporter=text-summary --coverage.reporter=json-summary
          python3 - <<'PY'
          import json
          from pathlib import Path

          threshold = 75
          summary = json.loads(Path("coverage/coverage-summary.json").read_text())
          lines = float(summary["total"]["lines"]["pct"])
          print(f"Frontend line coverage: {lines:.2f}%")
          if lines < threshold:
              raise SystemExit(f"Frontend coverage {lines:.2f}% is below {threshold}%")
          PY

      - name: Rust coverage check
        working-directory: ./v4
        run: |
          cargo llvm-cov --workspace --fail-under-lines 70 --ignore-filename-regex "(ai\.rs|src-tauri|cli/src/main\.rs|os_native\.rs|network\.rs|tui/src/)" -- --test-threads=1

  security:
    name: Security Audit
    needs: [coverage]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@1929cdef3ca26202efbfbb4719c58ecf43e84097 # cargo-audit

      - name: Cargo Audit (CVE Scan)
        continue-on-error: true
        run: |
          mkdir -p ../reports
          cargo audit --json > ../reports/rust-audit.json 2>/dev/null || true
          echo "## Cargo Audit Results"
          cargo audit --deny warnings 2>&1 || echo "::warning::Vulnerabilities found in dependencies (see CVE report artifact)"
        working-directory: ./v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Frontend Audit
        continue-on-error: true
        run: |
          mkdir -p ../../reports
          if bun audit --help >/dev/null 2>&1; then
            bun audit 2>&1 | tee ../../reports/frontend-audit.txt
          else
            bunx audit-ci@^7 --moderate 2>&1 | tee ../../reports/frontend-audit.txt
          fi
        working-directory: ./v4/apps/desktop

      - name: Generate CVE Report
        if: always()
        run: |
          mkdir -p reports
          echo "# OmniMon CVE Report - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > reports/cve-summary.md
          echo "" >> reports/cve-summary.md
          echo "## Rust Dependencies" >> reports/cve-summary.md
          if [ -f reports/rust-audit.json ]; then
            echo '```json' >> reports/cve-summary.md
            cat reports/rust-audit.json >> reports/cve-summary.md
            echo '```' >> reports/cve-summary.md
          else
            echo "No Rust audit data available." >> reports/cve-summary.md
          fi
          echo "" >> reports/cve-summary.md
          echo "## Frontend Dependencies" >> reports/cve-summary.md
          if [ -f reports/frontend-audit.txt ]; then
            echo '```text' >> reports/cve-summary.md
            cat reports/frontend-audit.txt >> reports/cve-summary.md
            echo '```' >> reports/cve-summary.md
          else
            echo "No frontend audit data available." >> reports/cve-summary.md
          fi

      - name: Upload CVE Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cve-report
          path: reports/
          retention-days: 90

      - name: Secret Scanning (TruffleHog)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@ef63d66d58bb7317d9b220b02af5beae569835ee # main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  release:
    name: Release Builder (${{ matrix.platform }})
    needs: [lint]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            args: ""
          - platform: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./v4/apps/desktop

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Add Intel target for universal macOS binary
        if: matrix.platform == 'macos-universal'
        run: rustup target add x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "v4"

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./v4/apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "OmniMon ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Automated multiplatform release for OmniMon ${{ inputs.tag || github.ref_name }}

            **macOS note:** If macOS shows "app is damaged", run:
            ```
            xattr -cr /Applications/OmniMon.app
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  sign-release:
    name: Sign Release Artifacts (SHA-256 + Ed25519)
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          sleep 15
          mkdir -p /tmp/release-artifacts
          gh release download "$TAG" --repo "$REPO" --dir /tmp/release-artifacts || true

      - name: Generate SHA-256 checksums
        run: |
          cd /tmp/release-artifacts
          rm -f SHA256SUMS.txt
          count=0
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              SHA256SUMS*|*.sig.json|releases.json) continue ;;
            esac
            sha256sum "$f" >> SHA256SUMS.txt
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::warning::No release artifacts found to checksum"
          else
            echo "Generated checksums for $count artifacts:"
            cat SHA256SUMS.txt
          fi

      - name: Sign artifacts with Ed25519
        if: env.ED25519_SIGNING_KEY != ''
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
        run: |
          cd /tmp/release-artifacts
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS.txt" ] && continue
            echo "$f" | grep -qE '\.(sig\.json|sha256)$' && continue
            echo "Signing: $f"
            bash "$GITHUB_WORKSPACE/scripts/sign-release.sh" "$f" "${{ inputs.tag || github.ref_name }}"
          done
          echo "All artifacts signed."

      - name: Generate releases.json manifest
        if: env.ED25519_SIGNING_KEY != ''
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd /tmp/release-artifacts
          VERSION="${TAG#v}"
          DATE=$(date -u +%Y-%m-%d)

          # Build releases.json from individual .sig.json files
          python3 - <<'PY'
          import json, glob, os

          version = os.environ["VERSION"]
          date = os.environ["DATE"]
          artifacts = []

          for sig_file in sorted(glob.glob("*.sig.json")):
              with open(sig_file) as f:
                  sig = json.load(f)
              artifact_name = sig.get("artifact", sig_file.replace(".sig.json", ""))
              artifact_path = sig_file.replace(".sig.json", "")
              size = os.path.getsize(artifact_path) if os.path.exists(artifact_path) else 0
              lower = artifact_name.lower()

              platform = "unknown"
              if "linux" in lower or ".appimage" in lower or ".deb" in lower or ".rpm" in lower:
                  platform = "linux"
              elif "macos" in lower or "darwin" in lower or ".dmg" in lower:
                  platform = "macos"
              elif "windows" in lower or ".msi" in lower or ".exe" in lower:
                  platform = "windows"

              arch = "unknown"
              if "universal" in lower:
                  arch = "universal"
              elif "aarch64" in lower or "arm64" in lower:
                  arch = "aarch64"
              elif "x86_64" in lower or "amd64" in lower:
                  arch = "x86_64"

              artifacts.append({
                  "filename": artifact_name,
                  "platform": platform,
                  "arch": arch,
                  "sha256": sig["sha256"],
                  "signature_b64": sig["signature_b64"],
                  "size_bytes": size,
              })

          manifest = {
              "version": version,
              "date": date,
              "artifacts": artifacts,
              "manifest_signature": "GENERATED_BY_CI"
          }

          with open("releases.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Generated releases.json with {len(artifacts)} artifacts")
          PY

      - name: Upload checksums, signatures, and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          cd /tmp/release-artifacts
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
          for sig in *.sig.json; do
            [ -f "$sig" ] || continue
            gh release upload "$TAG" "$sig" --repo "$REPO" --clobber
          done
          if [ -f releases.json ]; then
            gh release upload "$TAG" releases.json --repo "$REPO" --clobber
          fi
          echo "Checksums, signatures, and manifest uploaded to release $TAG"

  rename-assets:
    name: Rename Release Assets
    needs: [release, sign-release]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove duplicate assets from previous builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          sleep 30
          # Collect all assets grouped by extension/type. Keep only the newest per type.
          ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets | sort_by(.created_at) | reverse | .[] | "\(.id)|\(.name)"')
          declare -A SEEN
          while IFS='|' read -r ID NAME; do
            [ -z "$NAME" ] && continue
            # Normalize to canonical type key
            KEY=""
            case "$NAME" in
              *.dmg) KEY="dmg" ;;
              *.AppImage) KEY="appimage" ;;
              *.deb) KEY="deb" ;;
              *.rpm) KEY="rpm" ;;
              *.msi) KEY="msi" ;;
              *.nsis.zip) KEY="nsis" ;;
              SHA256SUMS*|*.sig.json|releases.json) continue ;;
              *) continue ;;
            esac
            if [ -n "${SEEN[$KEY]+x}" ]; then
              echo "Deleting duplicate: $NAME (ID: $ID)"
              gh api "repos/$REPO/releases/assets/$ID" -X DELETE --silent || true
            else
              SEEN[$KEY]=1
            fi
          done <<< "$ASSETS"

      - name: Rename assets to user-friendly names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "\(.id)|\(.name)"')
          echo "Found assets:"
          echo "$ASSETS"
          while IFS='|' read -r ID NAME; do
            NEW_NAME=""
            LABEL=""
            case "$NAME" in
              *universal*.dmg)
                NEW_NAME="OmniMon-${TAG#v}-macOS-Universal.dmg"
                LABEL="macOS (Apple Silicon + Intel)"
                ;;
              *aarch64*.dmg)
                NEW_NAME="OmniMon-${TAG#v}-macOS-Apple-Silicon.dmg"
                LABEL="macOS (Apple Silicon)"
                ;;
              *.AppImage)
                NEW_NAME="OmniMon-${TAG#v}-Linux.AppImage"
                LABEL="Linux (AppImage - portable)"
                ;;
              *.deb)
                NEW_NAME="OmniMon-${TAG#v}-Linux.deb"
                LABEL="Linux (Debian/Ubuntu)"
                ;;
              *.rpm)
                NEW_NAME="OmniMon-${TAG#v}-Linux.rpm"
                LABEL="Linux (Fedora/RHEL/openSUSE)"
                ;;
              *.msi)
                NEW_NAME="OmniMon-${TAG#v}-Windows.msi"
                LABEL="Windows (64-bit installer)"
                ;;
              *.nsis.zip)
                NEW_NAME="OmniMon-${TAG#v}-Windows-Setup.exe.zip"
                LABEL="Windows (NSIS installer)"
                ;;
              *)
                echo "Skipping: $NAME"
                continue
                ;;
            esac
            if [ "$NAME" = "$NEW_NAME" ]; then
              echo "Already named: $NAME"
              continue
            fi
            echo "Renaming: $NAME -> $NEW_NAME ($LABEL)"
            gh api "repos/$REPO/releases/assets/$ID" -X PATCH -f name="$NEW_NAME" -f label="$LABEL" --silent
          done <<< "$ASSETS"
          echo "All assets renamed successfully."
