changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🛡️ Security
      labels:
        - security
    - title: 🧹 Maintenance
      labels:
        - chore
        - refactor
        - documentation
        - maintenance
